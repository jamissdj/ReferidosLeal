  function estadoEfectivo(c) { return overrides[c.nombre] ? (overrides[c.nombre].estado || 'En proceso') : (c.estado || 'Disponible'); }
  function estadoClass(e) {
    const m = { 'Disponible': 'disponible', 'En proceso': 'en-proceso', 'Contratado': 'contratado', 'Rechazado': 'rechazado' };
    return m[e] || 'disponible';
  }
  function estadoLabel(e) { if (!e || e === 'None') return 'Disponible'; return e; }

  function updateStats(data) {
    var disp = data.filter(c => estadoEfectivo(c) === 'Disponible').length;
    var proc = data.filter(c => estadoEfectivo(c) === 'En proceso').length;
    document.getElementById('stat-total').textContent = disp + proc;
    document.getElementById('stat-disp').textContent = disp;
    document.getElementById('stat-proc').textContent = proc;
  }

  function notifyAdmin(nombre, nuevoEstado) {

  function renderEstadoActions(container, c, est, note) {

        showFormGerente(_c.nombre, function(gNombre, gCargo) {

    } else if (est === 'En proceso') {

        // Allow undo

              updateStats(candidatos); applyFilters();
              var _ni = filtered.findIndex(function(x){return x.nombre===_c3.nombre;});
              if (_ni >= 0) openModal(_ni); else closeModal();

      }
      (function(_c4, _idx4) {

            overrides[_c4.nombre] = { estado: 'Contratado', fecha: new Date().toISOString() };
            saveOverrides(overrides);
            logHistorial(_c4.nombre, 'Contratado', gNombre, gCargo);
            updateStats(candidatos); applyFilters();
            var _ni = filtered.findIndex(function(x){return x.nombre===_c4.nombre;});
            if (_ni >= 0) openModal(_ni); else closeModal();
          });
        }));
      })(c, currentIdx);
      (function(_c5, _idx5) {
        row.appendChild(makeBtn('&#10005; Rechazado', 'btn-rechazado', function() {
          showFormGerente(_c5.nombre, function(gNombre, gCargo) {
            overrides[_c5.nombre] = { estado: 'Rechazado', fecha: new Date().toISOString() };
            saveOverrides(overrides);
            logHistorial(_c5.nombre, 'Rechazado', gNombre, gCargo);
            updateStats(candidatos); applyFilters();
            var _ni = filtered.findIndex(function(x){return x.nombre===_c5.nombre;});
            if (_ni >= 0) openModal(_ni); else closeModal();
          });

      })(c, currentIdx);

    } else if (est === 'Contratado') {
      var marcadoLocalCont = overrides[c.nombre];

        row.appendChild(makeBtn('&#8635; Revertir estado', 'btn-secondary', function() {

      } else {

        info3.textContent = 'Estado registrado en la base de datos.';

      }
    } else if (est === 'Rechazado') {
      var marcadoLocalRech = overrides[c.nombre];
      if (marcadoLocalRech) {
        row.appendChild(makeBtn('&#8635; Revertir estado', 'btn-secondary', function() {
          var _nombreRR = c.nombre;
          delete overrides[_nombreRR]; saveOverrides(overrides);
          logHistorial(_nombreRR, 'Revertido a Disponible (desde Rechazado)', 'Gerente', null);
          updateStats(candidatos); applyFilters(); openModal(currentIdx);
        }));
      }
      // Always allow reactivation, whether override or from Excel
      row.appendChild(makeBtn('&#9200; Iniciar nuevo proceso', 'btn-proceso', function() {
        var _c2 = c; var _idx2 = currentIdx;
        showFormGerente(_c2.nombre, function(gNombre, gCargo) {

    function applyFilters() {
    const q = currentSearch.toLowerCase().trim();
    if (!currentFilter && !q) {
      filtered = [];
      renderGrid(true);
      document.getElementById('results-count').textContent = '';
      return;
    }
    filtered = candidatos.filter(c => {
      const est = estadoEfectivo(c);
      if (currentFilter && currentFilter !== 'todos' && est !== currentFilter) return false;
      if (currentCargo !== 'todos' && (c.cargo || '').trim() !== currentCargo) return false;
      if (q) {
        const hay = [c.nombre, c.cargo, c.profesion, c.ultima_empresa, c.ultimo_cargo, c.resumen, c.referido_por].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    var sortVal = (document.getElementById('sort-select') || {}).value || 'fecha-desc';
    filtered.sort(function(a, b) {
      if (sortVal === 'alfa') return (a.nombre || '').localeCompare(b.nombre || '', 'es');
      var da = a.fecha || '0', db = b.fecha || '0';
      if (sortVal === 'fecha-asc') return da < db ? -1 : da > db ? 1 : 0;
      return da > db ? -1 : da < db ? 1 : 0;
    });
    renderGrid();
    document.getElementById('results-count').textContent = filtered.length + ' candidato' + (filtered.length !== 1 ? 's' : '');
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderGrid(noFilter) {
    const grid = document.getElementById('grid');
    if (noFilter) {
      grid.innerHTML = '<div class="empty"><div class="empty-icon">&#127919;</div><p>Selecciona un filtro para ver los candidatos.</p></div>';
      return;
    }
    if (!filtered.length) {
      grid.innerHTML = '<div class="empty"><div class="empty-icon">&#128269;</div><p>No hay candidatos que coincidan con los filtros.</p></div>';
      return;
    }
    grid.innerHTML = filtered.map((c, i) => {
      const est = estadoEfectivo(c), cls = estadoClass(est);
      return '<div class="card" data-idx="' + i + '" tabindex="0">' +
        '<div class="card-stripe ' + cls + '"></div>' +
        '<div class="card-body">' +
          '<div class="card-top">' +
            '<div class="card-name">' + esc(c.nombre) + '</div>' +
            '<span class="badge ' + cls + '">' + estadoLabel(est) + '</span>' +
          '</div>' +
          '<div class="card-cargo">' + esc(c.cargo || 'Sin cargo definido') + '</div>' +
          '<div class="card-meta">' +
            (c.experiencia ? '<span>' + esc(c.experiencia) + '</span>' : '') +
            (c.ultima_empresa ? '<span>' + esc(c.ultima_empresa) + '</span>' : '') +
          '</div>' +
          (c.resumen ? '<p class="card-resumen">' + esc(c.resumen) + '</p>' : '') +
        '</div>' +
        '<div class="card-footer">' +
          '<div class="ref-info">Referido por <strong>' + esc(c.referido_por || '—') + '</strong>' + (c.fecha ? '<span style="color:var(--text-4);font-size:11px;margin-left:6px;">· ' + c.fecha + '</span>' : '') + '</div>' +
          '<button class="btn-ver">Ver perfil →</button>' +
        '</div>' +
      '</div>';
    }).join('');
    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openModal(parseInt(card.dataset.idx)));
      card.addEventListener('keydown', e => { if (e.key === 'Enter') openModal(parseInt(card.dataset.idx)); });
    });
  }

  function openModal(idx) {
    currentIdx = idx;
    const c = filtered[idx];
    const est = estadoEfectivo(c), cls = estadoClass(est);
    document.getElementById('m-nombre').textContent = c.nombre;
    document.getElementById('m-cargo').textContent = c.cargo || '';
    const badge = document.getElementById('m-estado-badge');
    badge.textContent = estadoLabel(est); badge.className = 'badge ' + cls;
    document.getElementById('m-resumen').textContent = c.resumen || '';
    document.getElementById('m-resumen-section').style.display = c.resumen ? '' : 'none';
    document.getElementById('m-exp').textContent = c.experiencia || '—';
    document.getElementById('m-empresa').textContent = c.ultima_empresa || '—';
    document.getElementById('m-ucargo').textContent = c.ultimo_cargo || '—';
    document.getElementById('m-prof').textContent = c.profesion || '—';
    document.getElementById('m-uni').textContent = c.universidad || '—';
    document.getElementById('m-ref').textContent = c.referido_por || '—';
    const procSec = document.getElementById('m-proceso-section');
    if (c.entrevistado_por) { procSec.style.display = ''; document.getElementById('m-entpor').textContent = c.entrevistado_por; }
    else { procSec.style.display = 'none'; }
    const btnCv = document.getElementById('btn-cv');
    if (c.cv_file) { btnCv.href = c.cv_file; btnCv.style.display = ''; } else { btnCv.style.display = 'none'; }
    const btnLi = document.getElementById('btn-linkedin');
    if (c.linkedin && c.linkedin !== 'None') { btnLi.href = c.linkedin; btnLi.style.display = ''; } else { btnLi.style.display = 'none'; }
    const note = document.getElementById('proceso-note');
    const actionsDiv = document.getElementById('modal-estado-actions');
    note.style.display = 'none';
    renderEstadoActions(actionsDiv, c, est, note);
    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
    currentIdx = null;
  }

  // Estado actions rendered dynamically — no static listener needed

  document.getElementById('btn-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === document.getElementById('modal-overlay')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function limpiarFiltro() {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    document.getElementById('btn-limpiar').style.display = 'none';
    currentFilter = null;
    applyFilters();
  }
  document.getElementById('btn-limpiar').addEventListener('click', limpiarFiltro);

  document.querySelectorAll('.pill[data-estado]').forEach(pill => {
    pill.addEventListener('click', function() {
      document.querySelectorAll('.pill[data-estado]').forEach(p => p.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.estado;
      document.getElementById('btn-limpiar').style.display = '';
      applyFilters();
    });
  });

  document.addEventListener('gerente-confirmed', function(e) {
    if (_pendingProceso) {
      _pendingProceso(e.detail.nombre, e.detail.cargo);
      _pendingProceso = null;
    }
  });

  document.querySelectorAll('.pill.cargo').forEach(pill => {
    pill.addEventListener('click', function() {
      document.querySelectorAll('.pill.cargo').forEach(p => p.classList.remove('active'));
      this.classList.add('active');
      currentCargo = this.dataset.cargo;
      applyFilters();
    });
  });

  document.getElementById('search').addEventListener('input', function() { currentSearch = this.value; applyFilters(); });
  document.getElementById('sort-select').addEventListener('change', function() { applyFilters(); });

  // candidatos loaded via Firebase callback above

  document.getElementById('modal-nuevo-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeNuevo();
  });

  // ---- Gerente identification form ----
  var _pendingProceso = null;

  function showFormGerente(candidatoNombre, onConfirm) {
    document.getElementById('gf-candidato-label').textContent = 'Marcando en proceso: ' + candidatoNombre;
    document.getElementById('gf-nombre').value = localStorage.getItem('gerente_nombre') || '';
    document.getElementById('gf-cargo').value = localStorage.getItem('gerente_cargo') || '';
    document.getElementById('gerente-form-overlay').style.display = 'flex';
    _pendingProceso = onConfirm;
  }

})();
</script>
<script>
function cancelarFormGerente() {
  document.getElementById('gerente-form-overlay').style.display = 'none';
  window._pendingProceso = null;
}
function confirmarFormGerente() {
  var nombre = document.getElementById('gf-nombre').value.trim();
  var cargo = document.getElementById('gf-cargo').value.trim();
  if (!nombre) { document.getElementById('gf-nombre').style.borderColor = '#EF4444'; return; }

  localStorage.setItem('gerente_cargo', cargo);

  document.dispatchEvent(new CustomEvent('gerente-confirmed', { detail: { nombre, cargo } }));

    if (email) entry.email = email;
    if (nota) entry.nota = nota;
    db2.ref('referidos_nuevos').push(entry).catch(function(e) { console.warn('Firebase error:', e); });
  }
  // Build mailto
  var asunto = encodeURIComponent('[Nuevo Referido] ' + nombre + ' – ' + cargo);
    var cuerpo = 'NUEVO CANDIDATO REFERIDO' +
    '\n\nReferido por: ' + referente +
    '\nCandidato: ' + nombre +
    '\nCargo al que aplica: ' + cargo +
    (email ? '\nCorreo candidato: ' + email : '') +
    (nota ? '\n\nNota: ' + nota : '') +
    '\n\nFecha: ' + new Date().toLocaleString('es-CO') +
    '\n\n---\nEnviado desde el portal Referidos Leal';
  cerrarFormReferir();
  window.location.href = 'mailto:jamis.garzon@lla.com?subject=' + asunto + '&body=' + encodeURIComponent(cuerpo);
}
